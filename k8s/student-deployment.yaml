apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-management
spec:
  replicas: 2

  selector:
    matchLabels:
      app: student-management

  template:
    metadata:
      labels:
        app: student-management

    spec:
      containers:
        - name: student-management
          image: neeleshram/student-management:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 8080

          env:
            - name: DB_URL
              value: jdbc:mysql://mysql-service:3306/studentdb

            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: student-db-secret
                  key: MYSQL_USER

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: student-db-secret
                  key: MYSQL_PASSWORD