<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Management System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Student Management System</h1>
        <p>DevOps Two-Tier Application</p>
    </header>

    <main>

        <section class="card">

            <h2>Add Student</h2>

            <form id="studentForm">

                <input
                    type="text"
                    id="name"
                    placeholder="Student Name"
                    required
                >

                <input
                    type="email"
                    id="email"
                    placeholder="Email"
                    required
                >

                <input
                    type="text"
                    id="course"
                    placeholder="Course"
                    required
                >

                <button type="submit">
                    Add Student
                </button>

            </form>

        </section>


        <section class="card">

            <h2>Student List</h2>

            <div id="studentList">
                <p>Loading students...</p>
            </div>

        </section>

    </main>

    <footer>
        <p>Student Management POC | Spring Boot + MySQL + Kubernetes</p>
    </footer>

    <script src="app.js"></script>

</body>
</html>
